# P2P Core 默认配置文件

[network]
listen_port = 6881
bind_address = 0.0.0.0
max_connections = 1000
connection_timeout = 30

[performance]
upload_limit_kbps = 1024
download_limit_kbps = 2048
burst_limit_kbps = 5120
max_memory_mb = 512

[security]
enable_tls = false
cert_file = 
key_file = 
enable_authentication = false

[discovery]
seed_nodes = 
tracker_urls = 
stun_servers = stun:stun.l.google.com:19302
enable_dht = true

[logging]
level = info
output_file = 
console_output = true
